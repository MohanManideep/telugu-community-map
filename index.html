<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Koblenz Telugu Families</title>
<meta name="description" content="Private community map for Telugu families in Koblenz and nearby towns.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b2428" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=Mandali&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" media="print" onload="this.media='all'">
<style>
/* Layout: one-screen map app. Compact header (title, activity, menu, search), full-bleed map,
   floating "My family" button, and a bottom sheet (side panel on wide screens) for everything else. */
:root{
  --bg:#eef1ec; --ink:#1c2a2f; --muted:#5b6a6e; --surface:#ffffff; --surface-2:#f4f6f2; --line:#dde3df;
  --accent:#d9860b; --accent-ink:#ffffff; --accent-soft:#fdf1dd; --dot:#c62f2a; --ok:#25804d; --ok-soft:#e3f3ea;
  --mine:#1f6f8b; --halo:#ffffff; --focus:#1f6f8b;
  --shadow:0 12px 32px rgba(28,42,47,.16); --shadow-sm:0 2px 10px rgba(28,42,47,.12);
  --r:14px; --ease:cubic-bezier(.2,.9,.25,1);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --telugu:"Mandali","Noto Sans Telugu",ui-sans-serif,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11181b; --ink:#e7eeec; --muted:#9aaaae; --surface:#1b2428; --surface-2:#222d32; --line:#33424a;
    --accent:#f0a032; --accent-ink:#1a1206; --accent-soft:#3a2b12; --dot:#ff5a4f; --ok:#5cc28a; --ok-soft:#173326;
    --mine:#5cb8d6; --halo:#11181b; --focus:#7cc4dd;
    --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  .maplibregl-canvas{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.7)}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;position:fixed;inset:0;padding:env(safe-area-inset-top,0) 0 0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column}

/* ---------- buttons & inputs ---------- */
button,.btnlink{font:inherit;cursor:pointer;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s,transform .12s,box-shadow .15s}
button:active,.btnlink:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default;transform:none}
@media (hover:hover){button:hover,.btnlink:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
@media (hover:hover){.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000);border-color:transparent}}
.ghost{background:transparent;border-color:transparent}
.link{background:none;border:0;padding:0;color:var(--focus);text-decoration:underline;display:inline}
.danger{color:var(--dot);border-color:color-mix(in srgb,var(--dot) 45%,transparent);background:transparent}
.danger-solid{background:var(--dot);color:#fff;border-color:transparent;font-weight:700}
.linkdanger{background:none;border:0;color:var(--dot);padding:6px 0;font-size:14px;align-self:flex-start}
.small{padding:5px 10px;font-size:13px;border-radius:9px}
.grow{flex:1}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.opt{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;transition:border-color .15s,background-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface);outline:none}
textarea{resize:vertical;min-height:72px}
.err{color:var(--dot);font-size:13.5px;min-height:1em}
.ok{color:var(--ink);font-size:13.5px}

/* ---------- header ---------- */
header{position:relative;z-index:1000;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 12px 10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:inherit;text-decoration:none;border-radius:12px;padding:2px}
.logo{flex:none;width:36px;height:36px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;transition:transform .3s var(--ease)}
.brand:active .logo{transform:scale(.9) rotate(-6deg)}
.brand-text{min-width:0;display:flex;flex-direction:column}
.brand h1{font-family:var(--display);font-size:17.5px;margin:0;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small .te{font-family:var(--telugu);font-size:14px;color:var(--ink)}
@media (hover:hover){.brand:hover h1{color:var(--accent)}}
.hdr-actions{display:flex;align-items:center;gap:6px}
.iconbtn{position:relative;width:42px;height:42px;padding:0;border-radius:12px}
.iconbtn.av{border:0;background:none;border-radius:50%}
.count{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--dot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);font-variant-numeric:tabular-nums}
.count.bump{animation:bump .5s var(--ease)}
.search{grid-column:1/-1;position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search{margin:0}
.search input{padding:9px 14px 9px 38px;border-radius:999px;font-size:16px}
@media (min-width:820px){
  header{grid-template-columns:auto minmax(0,1fr) auto;padding:10px 16px}
  .search{grid-column:2;grid-row:1;max-width:380px;width:100%;justify-self:center}
  .hdr-actions{grid-column:3;grid-row:1}
}

/* ---------- avatars & chips ---------- */
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display);font-size:15px;background:var(--c,#c97a0a);letter-spacing:.02em}
.avatar.lg{width:50px;height:50px;font-size:19px}
.avatar.sm{width:34px;height:34px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip-s{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip-s.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.chip-s.you{background:color-mix(in srgb,var(--mine) 14%,transparent);color:var(--mine);font-weight:700}

/* ---------- map & overlays on it ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}
.maplibregl-map{font-family:var(--body)}
.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden;box-shadow:var(--shadow-sm)!important}
.maplibregl-ctrl-group button{width:38px;height:38px;border-radius:0;padding:0}
.maplibregl-ctrl-bottom-left{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.placing .maplibregl-canvas-container{cursor:crosshair}
.placing .fab,.placing .mapkey,.placing .loading{display:none}
.maperr{position:absolute;inset:auto 16px 50% 16px;transform:translateY(50%);z-index:600;max-width:340px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--shadow)}
.maperr p{margin:0 0 10px;color:var(--muted)}
.fab{position:absolute;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:800;padding:13px 18px 13px 15px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 40%,transparent),var(--shadow-sm);animation:fabIn .45s var(--ease) both}
.fab.mine{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.fab.mine svg{color:var(--mine)}
.mapkey{position:absolute;left:12px;top:12px;z-index:700}
.mapkey>button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:var(--shadow-sm);border-color:transparent}
.keypop{margin-top:8px;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);width:min(300px,calc(100vw - 24px));animation:popIn .25s var(--ease) both;transform-origin:top left}
.loading{position:absolute;left:50%;top:14px;translate:-50% 0;z-index:750;background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:8px;animation:fadeIn .3s both}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.empty{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:600;background:var(--surface);border-radius:18px;padding:18px;width:min(320px,calc(100% - 32px));text-align:center;box-shadow:var(--shadow);animation:popIn .4s var(--ease) both}
.empty h2{font-family:var(--display);font-size:18px;margin:6px 0}
.empty p{margin:0 0 14px;color:var(--muted);font-size:14px}

/* ---------- map key ---------- */
.keylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13.5px;color:var(--ink)}
.keylist li{display:flex;align-items:center;gap:10px}
.k{position:relative;flex:none;width:24px;height:24px}
.k-flag::before,.k-approx::before,.k-mine::before{content:"";position:absolute;left:6px;top:2px;width:2px;height:19px;background:var(--ink);border-radius:1px}
.k-flag::after,.k-approx::after,.k-mine::after{content:"";position:absolute;left:8px;top:2px;width:13px;height:10px;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%)}
.k-approx::after{opacity:.5}
.k-mine::after{background:var(--mine)}
.k-dot::after,.k-ring::after{content:"";position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--dot)}
.k-ring::after{background:var(--surface);border:2px solid var(--dot)}

/* ---------- flags ---------- */
.flag-icon{width:0;height:0;cursor:pointer;background:none;border:0}
.flag-icon.sel{z-index:5}
.flag-icon .flag{transition:transform .25s ease,scale .3s var(--ease),translate .2s ease,opacity .3s ease}
.flag-icon.dim .flag{opacity:.28}
.flag-icon.dim .nm{visibility:hidden}
.bestchip{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px;align-self:flex-start;margin-bottom:2px}
.flag{position:relative;width:0;height:0;transform:scale(var(--s,1));transform-origin:0 0;transition:transform .25s ease,scale .3s var(--ease),translate .2s ease}
.flag-icon.new .flag{animation:drop .6s var(--ease) var(--d,0ms) both}
@media (hover:hover){.flag-icon:hover .flag{translate:0 -3px}}
.flag-icon.sel .flag{scale:1.25}
.flag.crowded .nm{display:none}
.flag-icon:hover .flag.crowded .nm,.flag-icon:focus .flag.crowded .nm,.flag-icon.sel .flag.crowded .nm{display:block}
.flag .pole{position:absolute;left:-1px;bottom:-2px;width:2px;height:30px;background:var(--ink);border-radius:1px}
.flag .pen{position:absolute;left:1px;bottom:12px;width:18px;height:12px;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%);transform-origin:left center;animation:wave 3s ease-in-out infinite}
.flag .base{position:absolute;left:-3.5px;bottom:-5px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.flag-icon.sel .base::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--accent);animation:ring 1.4s ease-out infinite}
.flag .nm{position:absolute;left:22px;bottom:9px;white-space:nowrap;font-weight:700;font-size:13px;color:var(--ink);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 2px var(--halo)}
.flag .dot{position:absolute;left:12px;bottom:23px;width:11px;height:11px;border-radius:50%;background:var(--dot);border:1.5px solid var(--halo)}
.flag .dot.read{background:var(--halo);border:2px solid var(--dot);width:10px;height:10px}
.flag .dot.unread::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--dot);animation:pulse 1.8s ease-out infinite}
.flag.mine .pen{background:var(--mine)}
.flag.approx .pen{opacity:.5}
.flag.approx .base{background:var(--halo);border:1.5px solid var(--ink)}
.flag.temp .pen{filter:drop-shadow(0 0 5px var(--accent))}

/* ---------- placing bar ---------- */
.placebar{position:absolute;left:12px;right:12px;top:12px;margin:0 auto;max-width:460px;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);z-index:1300;animation:slideDown .35s var(--ease) both}
.placebar p{margin:0;font-size:14px}
.placebar .actions{margin:0}
.searchrow{display:flex;gap:8px}
.searchrow input{min-width:0}
.sugg{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow:auto}
.sugg button{justify-content:flex-start;text-align:left;padding:8px 10px;font-size:14px}
.placed{font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.placed.yes{color:var(--ok);font-weight:700}

/* ---------- bottom sheet ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18);padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:1200}
#sheet:not([hidden]){animation:sheetIn .38s var(--ease)}
#sheet.swap{animation:none}
#sheet.swap>*{animation:fadeUp .28s var(--ease) both}
#sheet.swap>*:nth-child(3){animation-delay:.03s}#sheet.swap>*:nth-child(4){animation-delay:.06s}#sheet.swap>*:nth-child(n+5){animation-delay:.09s}
#sheet.noanim>*{animation:none!important}
#sheet.closing{animation:sheetOut .22s ease-in forwards}
#sheet.formmode{padding-bottom:0}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 10px;touch-action:none}
@media (min-width:820px){
  #sheet{left:auto;top:0;width:400px;max-height:none;border-radius:0;border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.1);padding-top:14px}
  #sheet:not([hidden]){animation-name:sideIn}
  #sheet.closing{animation-name:sideOut}
  .grab{display:none}
}
body.loggedout #sheet{z-index:1600}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;touch-action:none}
.sheet-head .t{flex:1;min-width:0}
.sheet-head h2{font-family:var(--display);font-size:21px;line-height:1.2;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.sheet-head .sub{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.x{width:38px;height:38px;padding:0;border-radius:50%;flex:none;background:var(--surface-2);border-color:transparent}
.lead{margin:0 0 14px;color:var(--muted)}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:11px 13px;margin:10px 0}
.note b{color:var(--ink)}
.section-title{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:16px;font-weight:700;margin:18px 0 10px}
.section-title .n{background:var(--dot);color:#fff;font-family:var(--body);font-size:12px;border-radius:10px;padding:1px 8px}
.empty-line{color:var(--muted);font-size:14px;margin:0 0 6px}

/* message card */
.msg{border-radius:var(--r);padding:12px 14px;margin-bottom:14px;background:color-mix(in srgb,var(--dot) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--dot) 30%,transparent)}
.msg .lbl{display:flex;align-items:center;gap:6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dot);font-weight:700}
.msg p{margin:5px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.msg .when{font-size:12.5px;color:var(--muted)}

/* details list */
dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0}
dt{color:var(--muted);font-size:13px;padding-top:1px}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dirs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.dirs .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:16px;background:var(--surface)}
.card h3{font-family:var(--display);font-size:16px;margin:0 0 6px}
.card p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.card.hl{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:var(--accent-soft)}
.quote{color:var(--ink);font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
.who-sees{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.who-sees li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.who-sees svg{flex:none;margin-top:1px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;justify-content:flex-start;padding:10px 12px;border-radius:12px}
.person .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.person b{font-family:var(--display);font-size:15px}
.person .tx>span{color:var(--muted);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.person .udot{width:9px;height:9px;border-radius:50%;background:var(--dot);flex:none}
.req{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.req .top{display:flex;gap:12px;align-items:flex-start}
.req .top>div{min-width:0}
.req b{font-family:var(--display)}
.req .actions{margin:0}
.card.hl .req{border:0;padding:0;margin:0}

/* menu rows */
.profile{display:flex;align-items:center;gap:14px;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.profile .t{min-width:0;flex:1}
.profile b{display:block;font-family:var(--display);font-size:18px}
.profile .t>span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.rows{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;justify-content:flex-start;padding:10px 8px;border:0;border-radius:12px;background:none;font-size:15.5px}
@media (hover:hover){.row:hover{background:var(--surface-2)}}
.row .ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.row .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.row .lbl small{color:var(--muted);font-size:12.5px}
.row .chev{color:var(--muted);flex:none}
.row .n{background:var(--dot);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px}

/* FAQ */
details.faq{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:border-color .2s}
details.faq[open]{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
details.faq summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .25s var(--ease);flex:none}

details.faq li{margin-bottom:5px}

/* form */
.fform{display:flex;flex-direction:column;gap:12px}
.step{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.step-h{display:flex;align-items:center;gap:10px}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.step-h b{font-family:var(--display);font-size:16.5px}
.step-h .tag{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 9px}
.place{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.glabel{font-size:13px;color:var(--muted);margin-bottom:-4px}
.choices{display:grid;gap:8px}
.choice-card{flex-direction:row;align-items:flex-start;gap:11px;padding:11px 12px;border:1.5px solid var(--line);border-radius:13px;cursor:pointer;color:var(--ink);transition:border-color .15s,background-color .15s}
.choice-card input{width:18px;height:18px;margin:2px 0 0;padding:0;accent-color:var(--accent);flex:none}
.choice-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice-card .ic{flex:none;color:var(--muted);margin-top:1px}
.choice-card:has(input:checked) .ic{color:var(--accent)}
.choice-card .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.choice-card b{font-size:14.5px}
.choice-card small{color:var(--muted);font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{position:relative;display:inline-flex;flex-direction:row}
.pill input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pill span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;color:var(--ink);transition:background-color .15s,border-color .15s,color .15s}
.pill input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pill input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.counter{align-self:flex-end;font-size:12px;color:var(--muted);margin-top:-6px;font-variant-numeric:tabular-nums}
.formbar{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;margin:4px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.formbar .primary{flex:1;padding:12px}

/* ---------- auth & welcome overlays ---------- */
.overlay{position:absolute;inset:0;z-index:1500;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .3s both}
.overlay .card{margin:0;width:min(390px,100%);max-height:100%;overflow:auto;border-radius:20px;padding:20px;border:0;box-shadow:var(--shadow);animation:pop .45s var(--ease) both}
.overlay .card:focus{outline:none}
.overlay .card h2{font-family:var(--display);font-size:22px;margin:0 0 4px}
.overlay .card>p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.authform{display:flex;flex-direction:column;gap:12px}
.authform .primary{padding:12px}
.hello{font-family:var(--telugu);font-size:21px;color:var(--accent);margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.stat{background:var(--surface-2);border-radius:14px;padding:11px 13px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.hot b{color:var(--dot)}
.steps{margin:4px 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:23px;height:23px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;display:grid;place-items:center}
.news{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.news li{font-size:14px;overflow-wrap:anywhere}
.news li b::before{content:"● ";color:var(--dot)}


/* ---------- welcome ---------- */
.person .tx>.bestchip{display:inline-block;color:var(--accent);font-size:11.5px}
.overlay .card.wl{width:min(410px,100%);padding:0 20px 20px}

.wl-svg{display:block;width:100%;height:auto;max-height:118px;overflow:visible}
.wl-river{fill:none;stroke:#9cc8da;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1s cubic-bezier(.5,0,.2,1) forwards}
.wl-river.b{stroke:#b8d8e4;animation-delay:.12s}
.wf{transform-box:fill-box;transform-origin:bottom;animation:wdrop .6s var(--ease) both;animation-delay:calc(.35s + var(--i) * .14s)}
.wf .p{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.wf .b{fill:var(--ink)}
.wf .f{fill:var(--accent);transform-box:fill-box;transform-origin:left center;animation:wave 2.6s ease-in-out infinite}

@keyframes wdrop{0%{opacity:0;transform:translateY(-16px)}60%{opacity:1;transform:translateY(2px)}100%{transform:none}}

.toast{position:absolute;left:50%;top:14px;translate:-50% 0;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:2000;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.toast:not([hidden]){animation:toastIn .35s var(--ease)}

/* ---------- opening animation ---------- */
.intro{position:fixed;inset:0;z-index:5000;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;cursor:pointer;transition:opacity .5s ease,visibility .5s}
.intro.out{opacity:0;visibility:hidden}
.intro svg{width:min(300px,78vw);height:auto;overflow:visible}
.intro .river{fill:none;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .9s cubic-bezier(.5,0,.2,1) forwards}
.intro .rhine{stroke:#7fb3cc;stroke-width:9}
.intro .mosel{stroke:#9cc8da;stroke-width:6;animation-delay:.15s}
.intro .pole{fill:var(--ink);transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise .35s .65s cubic-bezier(.3,1.4,.5,1) forwards}
.intro .pen{fill:var(--accent);transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:unfurl .3s .95s ease-out forwards,wave 1.6s 1.25s ease-in-out infinite}
.intro .glow{fill:var(--accent);opacity:0;transform-box:fill-box;transform-origin:center;animation:glow 1s .9s ease-out forwards}
.intro h1{font-family:var(--display);font-size:clamp(24px,6vw,34px);margin:14px 0 0;letter-spacing:-.01em;opacity:0;animation:up .5s .8s ease-out forwards}
.intro .te{font-family:var(--telugu);font-size:clamp(18px,4.5vw,22px);color:var(--muted);opacity:0;animation:up .5s .95s ease-out forwards}
.intro .skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--muted);opacity:0;animation:up .4s 1.2s forwards}

/* ---------- motion ---------- */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{to{transform:scaleY(1)}}
@keyframes unfurl{to{transform:scaleX(1)}}
@keyframes wave{0%,100%{transform:scaleX(1) skewY(0)}50%{transform:scaleX(.9) skewY(-5deg)}}
@keyframes glow{0%{opacity:.5;transform:scale(.2)}100%{opacity:0;transform:scale(2.6)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes sideIn{from{transform:translateX(100%)}}
@keyframes sideOut{to{transform:translateX(100%)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}}
@keyframes toastIn{from{opacity:0;translate:-50% -16px}}
@keyframes fabIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes drop{0%{opacity:0;translate:0 -18px}60%{opacity:1;translate:0 2px}100%{translate:0 0}}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}

}

function connStatus(id){
  const o=outReq.get(id),i=inReq.get(id);
  if((o&&o.status==="accepted")||(i&&i.status==="accepted"))return"connected";
  if(i&&i.status==="pending")return"incoming";
  if(o)return"sent";
  return"none";
}
function connectedIds(){const s=new Set();for(const [k,v] of outReq)if(v.status==="accepted")s.add(k);for(const [k,v] of inReq)if(v.status==="accepted")s.add(k);return s}
function syncPrivateSubs(){
  const want=connectedIds();if(me)want.add(me);
  for(const [id,u] of privSubs)if(!want.has(id)){u();privSubs.delete(id);privates.delete(id)}
  for(const id of want)if(!privSubs.has(id))privSubs.set(id,onSnapshot(doc(db,"private",id),s=>{if(s.exists())privates.set(id,s.data());else privates.delete(id);refresh();if(openId===id&&sheet.dataset.mode==="family")openFamily(id,true)},()=>{}));
}
function famPos(f){const p=privates.get(f.id);if(p&&typeof p.lat==="number")return[p.lat,p.lng];return typeof f.lat==="number"?[f.lat,f.lng]:null}
function exactPos(f){const p=privates.get(f.id);if(p&&typeof p.lat==="number")return[p.lat,p.lng];return f.approx?null:famPos(f)}
function visibleAddress(f){const p=privates.get(f.id);if(p&&p.address)return{text:p.address,full:true};if(!f.approx&&f.address)return{text:f.address,full:true};if(f.street)return{text:f.street,full:false};return null}

// Flags saved before privacy settings existed: move contact into private storage (admin only, runs once).
async function migrateOldFlags(){
  const old=[...families.values()].filter(f=>f.v!==2&&typeof f.lat==="number");
  for(const f of old){
    try{
      const b=writeBatch(db);
      b.set(doc(db,"private",f.id),{lat:r6(f.lat),lng:r6(f.lng),address:f.address||"",contact:f.contact||"",dLat:0,dLng:0});
      b.set(doc(db,"families",f.id),{name:f.name,lat:r6(f.lat),lng:r6(f.lng),approx:false,locPublic:true,contactPublic:false,
        street:partialAddress(f.address||""),address:f.address||"",contact:"",
        profession:f.profession||"",interests:f.interests||"",members:f.members??null,kids:f.kids??null,
        languages:f.languages||[],about:f.about||"",message:f.message||null,updatedAt:f.updatedAt||now(),v:2});
      await b.commit();
    }catch(e){console.warn("migration",f.id,e)}
  }
}

// ---------- flags ----------
function flagHTML(f,{temp=false}={}){
  const m=activeMsg(f);let dot="";
  if(m&&!temp&&f.id!==me)dot=`<span class="dot ${seen[f.id]===m.postedAt?"read":"unread"}"></span>`;
  if(m&&!temp&&f.id===me)dot=`<span class="dot read"></span>`;
  const approx=!temp&&!exactPos(f)?" approx":"";
  return `<div class="flag${f.id===me?" mine":""}${temp?" temp":""}${approx}"><span class="pole"></span><span class="pen"></span><span class="base"></span>${dot}<span class="nm">${esc(f.name||"Your flag")}</span></div>`;
}
function makeFlagEl(id){
  const el=document.createElement("div");el.className="flag-icon";el.tabIndex=0;el.setAttribute("role","button");
  el.addEventListener("click",e=>{e.stopPropagation();lastFlagClick=now();if(!placing&&families.has(id))openFamily(id)});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();if(!placing)openFamily(id)}});
  return el;
}
function setSel(id){selId=id;for(const [k,o] of markers)o.el.classList.toggle("sel",k===id)}
function applyDim(){for(const [k,o] of markers)o.el.classList.toggle("dim",!!searchHits&&!searchHits.has(k))}
function redrawFlags(){
  for(const [id,o] of markers)if(!families.has(id)||(placing&&placing.id===id)){o.mk.remove();markers.delete(id)}
  if(!map)return;
  const list=[...families.values()].map(f=>({f,p:famPos(f)})).filter(o=>o.p&&!(placing&&placing.id===o.f.id)).sort((a,b)=>b.p[0]-a.p[0]);
  let fresh=0;
  for(const {f,p} of list){
    let o=markers.get(f.id);
    if(!o){
      const el=makeFlagEl(f.id);el.classList.add("new");el.style.setProperty("--d",Math.min(fresh++*45,600)+"ms");setTimeout(()=>el.classList.remove("new"),1300);
      o={el,mk:new maplibregl.Marker({element:el,anchor:"top-left"}).setLngLat([p[1],p[0]]).addTo(map)};markers.set(f.id,o);
    }else o.mk.setLngLat([p[1],p[0]]);
    o.el.setAttribute("aria-label",(f.name||"Family")+" flag");
    const html=flagHTML(f);if(o.el._h!==html){o.el.innerHTML=html;o.el._h=html}
    o.el.classList.toggle("sel",f.id===selId);
  }
  applyDim();scaleFlags();
}
// Flags grow when they're spread out and shrink when they're crowded together.
function scaleFlags(){
  if(!map)return;
  const pts=[];for(const [id,o] of markers)pts.push([o,map.project(o.mk.getLngLat())]);
  for(const [o,p] of pts){
    let d=Infinity;for(const [o2,q] of pts){if(o2===o)continue;const dd=Math.hypot(p.x-q.x,p.y-q.y);if(dd<d)d=dd}
    const s=d===Infinity?1.3:Math.max(.8,Math.min(1.3,.8+(d-30)/150));
    const el=o.el.querySelector(".flag");if(!el)continue;
    el.style.setProperty("--s",s.toFixed(2));el.classList.toggle("crowded",d<64);
  }
}

function unreadCount(){return[...families.values()].filter(f=>{const m=activeMsg(f);return m&&f.id!==me&&seen[f.id]!==m.postedAt}).length}

  bell.setAttribute("aria-label",n?`Activity, ${n} new`:"Activity");
  const mb=$("menuBtn");mb.hidden=!me;
  if(me){const mine=families.get(me);const nm=mine&&mine.name||(auth.currentUser&&auth.currentUser.email)||"?";if(mb.dataset.nm!==nm){mb.dataset.nm=nm;mb.replaceChildren(avatar(nm))}}

  const fab=$("fab");fab.hidden=!me||!famLoaded;
  if(me){const has=families.has(me);const label=has?"My family":"Add my family";if(fab.dataset.l!==label){fab.dataset.l=label;fab.replaceChildren(icon(has?"flag":"plus",19),h("span",null,label));fab.classList.toggle("mine",has)}}
  const e=$("empty");
  if(me&&famLoaded&&families.size===0){if(e.hidden){e.hidden=false;e.replaceChildren(h("p",{class:"hello"},"నమస్కారం!"),h("h2",null,"No families on the map yet"),h("p",null,"Be the first! Add your family and put your flag on your home."),h("button",{class:"primary",type:"button",onclick:()=>openForm(me)},icon("plus",18),"Add my family"))}}

  const keep={};for(const id in seen){const g=families.get(id);if(g&&activeMsg(g))keep[id]=seen[id]}

// Name matches count most, then job and interests, then languages, "about us" and street.
function matchScore(f,terms){

  const fields=[[f.name,6],[f.profession,3],[f.interests,3],[(f.languages||[]).join(" "),2],[f.about,1],[a&&a.text,1]].map(([t,w])=>[norm(t),w]).filter(x=>x[0]);

  return total;

  searchHits=new Set(hits.map(f=>f.id));applyDim();

  const list=h("div",{class:"list"});
  hits.forEach((f,i)=>list.append(h("button",{class:"person",type:"button",onclick:()=>{hideKeyboard();focusFamily(f);openFamily(f.id)}},avatar(f.name,"sm"),h("span",{class:"tx"},i===0&&hits.length>1?h("span",{class:"bestchip"},"Best match"):null,h("b",null,f.name||"Family"),h("span",null,[f.profession,f.interests].filter(Boolean).join(" · ")||"No details yet")),icon("chev",18))));
  if(!hits.length)list.append(h("p",{class:"empty-line"},"Try a shorter word, like a first name, a job or an interest."));

// ---------- placing the flag ----------
let tempMarker=null;
function setTemp(lat,lng,label){
  placing.pos=[lat,lng];if(label!==undefined)placing.addr=label;
  if(!tempMarker){
    const el=document.createElement("div");el.className="flag-icon new";el.innerHTML=flagHTML({name:placing.name},{temp:true});
    tempMarker=new maplibregl.Marker({element:el,anchor:"top-left",draggable:true}).setLngLat([lng,lat]).addTo(map);
    tempMarker.on("dragend",()=>{const p=tempMarker.getLngLat();placing.pos=[p.lat,p.lng];placing.addr=null});
  }else tempMarker.setLngLat([lng,lat]);
  $("p-done").disabled=false;
}
async function startPlacing(id,name,pos,onDone){
  if(!map){toast("The map is still loading…");const m=await mapReady;if(!m){toast("The map couldn't load. Check your connection and reload.");return}}
  placing={id,name:name||"Your flag",pos:null,addr:null,onDone};
  sheet.hidden=true;$("placebar").hidden=false;$("stage").classList.add("placing");refresh();
  $("p-addr").value="";$("p-sugg").textContent="";$("p-done").disabled=true;
  showHouseNumbers(true);redrawFlags();
  if(pos){setTemp(pos[0],pos[1]);goTo(pos[0],pos[1],Math.max(map.getZoom(),17))}
}
function endPlacing(ok){
  const p=placing;placing=null;if(tempMarker){tempMarker.remove();tempMarker=null}
  $("placebar").hidden=true;$("stage").classList.remove("placing");sheet.hidden=false;showHouseNumbers(false);refresh();
  if(ok&&p&&p.pos)p.onDone(p.pos,p.addr);
}
$("p-done").onclick=()=>endPlacing(true);
$("p-cancel").onclick=()=>endPlacing(false);
$("p-go").onclick=addrSearch;
$("p-addr").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addrSearch()}});
let lastGeo=0;
async function addrSearch(){
  const q=$("p-addr").value.trim(),box=$("p-sugg");box.textContent="";
  if(q.length<3){box.append(h("span",{class:"placed"},"Type your street and house number."));return}
  const wait=Math.max(0,1100-(now()-lastGeo));if(wait)await new Promise(r=>setTimeout(r,wait));lastGeo=now();
  box.append(h("span",{class:"placed"},"Searching…"));
  try{
    const u=new URL("https://nominatim.openstreetmap.org/search");
    u.search=new URLSearchParams({q,format:"jsonv2",countrycodes:"de",viewbox:"7.20,50.55,7.95,50.15",bounded:"0",limit:"6",addressdetails:"1","accept-language":"de"}).toString();
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);const res=await r.json();box.textContent="";
    if(!res.length){box.append(h("span",{class:"placed"},"No match. Check the spelling, or tap your house on the map."));return}
    for(const x of res){const a=x.address||{};
      const label=[[a.road||a.pedestrian||a.footway,a.house_number].filter(Boolean).join(" "),[a.postcode,a.city||a.town||a.village||a.suburb].filter(Boolean).join(" ")].filter(Boolean).join(", ")||x.display_name.split(",").slice(0,3).join(",");
      box.append(h("button",{type:"button",onclick:()=>{setTemp(+x.lat,+x.lon,label);goTo(+x.lat,+x.lon,18);box.textContent="";$("p-addr").value=label}},icon("pin",16),label))}
  }catch(e){box.textContent="";box.append(h("span",{class:"placed"},"Address search isn't available right now. Tap your house on the map instead."))}
}
$("p-loc").onclick=()=>{
  if(!navigator.geolocation){toast("Location isn't available on this device.");return}
  $("p-loc").disabled=true;
  navigator.geolocation.getCurrentPosition(p=>{$("p-loc").disabled=false;setTemp(p.coords.latitude,p.coords.longitude,null);goTo(p.coords.latitude,p.coords.longitude,18);toast("Check the flag is on your house, then tap Done.")},
    ()=>{$("p-loc").disabled=false;toast("Couldn't get your location. Search your address instead.")},{enableHighAccuracy:true,timeout:12000});
};

// ---------- add / edit family ----------
async function openForm(id){
  if(!id)return;const f=families.get(id)||{},editingOther=id!==me;
  let priv=privates.get(id)||null;
  if(!priv&&families.has(id)){try{const s=await getDoc(doc(db,"private",id));if(s.exists())priv=s.data()}catch(e){}}

  sheet.append(head(editingOther?"Edit family (admin)":families.has(id)?"Edit my family":"Add my family",editingOther?null:"Only you and the admin can change this"));

  const fullAddr=priv?priv.address:(f.address||""), fullContact=priv?priv.contact:(f.contact||"");

  const err=h("div",{class:"err",role:"alert"});
  const placedTxt=h("span",{class:"placed"}),placeBtn=h("button",{type:"button"});
  const sync=()=>{placedTxt.replaceChildren(pos?icon("check",16):"",pos?"Flag placed":"Not placed yet");placedTxt.className="placed"+(pos?" yes":"");placeBtn.replaceChildren(icon(pos?"pin":"flag",17),pos?"Move my flag":"Place my flag on the map");placeBtn.className=pos?"":"primary"};
  placeBtn.onclick=()=>startPlacing(id,$("f-name").value.trim()||f.name,pos,(p,addr)=>{pos=p;sync();err.textContent="";const a=$("f-addr");if(addr&&!a.value.trim()){a.value=addr;updPreview()}});
  sync();
  const preview=h("small");
  const updPreview=()=>{const a=$("f-addr").value.trim();preview.textContent=a?`Others see "${partialAddress(a)}" and your flag about 50 m away.`:"Others see your flag about 50 m away."};
  const choice=(name,val,checked,ic,title,sub)=>h("label",{class:"choice-card"},h("input",{type:"radio",name,value:val,checked}),h("span",{class:"ic"},icon(ic,19)),h("span",{class:"tx"},h("b",null,title),typeof sub==="string"?h("small",null,sub):sub));
  const step=(n,title,tag,...kids)=>h("section",{class:"step"},h("div",{class:"step-h"},h("span",{class:"step-n"},String(n)),h("b",null,title),tag?h("span",{class:"tag"},tag):null),...kids);
  const langs=h("div",{class:"pills",role:"group","aria-label":"Languages"},...LANGS.map(l=>h("label",{class:"pill"},h("input",{type:"checkbox",name:"lang",value:l,checked:(f.languages||[]).includes(l)}),h("span",null,l))));
  const m=activeMsg(f);
  const msgTa=h("textarea",{id:"f-msg",maxlength:240,rows:2,placeholder:"e.g. Bathukamma get-together on Saturday, all welcome!"});msgTa.value=m?m.text:"";
  const form=h("form",{novalidate:true,class:"fform"},
    step(1,"Your flag","Needed",
      inp("f-name","Family or display name",v(f.name),{extra:{maxlength:40,placeholder:"e.g. Rao family",autocomplete:"off"}}),
      h("div",{class:"place"},placeBtn,placedTxt),
      inp("f-addr","Address",v(fullAddr),{extra:{maxlength:120,placeholder:"e.g. Löhrstraße 12, 56068 Koblenz",autocomplete:"street-address"}},true)),
    step(2,"Who can see what",null,
      h("div",{class:"glabel"},"Your exact location and full address"),
      h("div",{class:"choices",role:"radiogroup"},choice("loc","public",locPublic,"globe","Everyone on the map","Your flag sits on your home"),choice("loc","private",!locPublic,"lock","Only connected families",preview)),
      inp("f-contact","Contact (phone, WhatsApp or email)",v(fullContact),{extra:{maxlength:80}},true),
      h("div",{class:"glabel"},"Your contact"),
      h("div",{class:"choices",role:"radiogroup"},choice("contact","public",contactPublic,"globe","Everyone on the map","Anyone logged in can see it"),choice("contact","private",!contactPublic,"lock","Only connected families","Recommended"))),
    step(3,"About you","Optional",
      inp("f-prof","What you do",v(f.profession),{extra:{maxlength:80,placeholder:"e.g. IT, student, doctor"}}),
      inp("f-int","Interests",v(f.interests),{extra:{maxlength:120,placeholder:"e.g. cricket, cooking, festivals"}}),
      h("div",{class:"row2"},inp("f-mem","Family members",v(f.members),{type:"number",extra:{min:1,max:20,inputmode:"numeric"}}),inp("f-kids","Kids",v(f.kids),{type:"number",extra:{min:0,max:15,inputmode:"numeric"}})),
      h("div",{class:"glabel"},"Languages"),langs,
      inp("f-about","About us",v(f.about),{tag:"textarea",extra:{maxlength:200,rows:2,placeholder:"A line or two about your family"}})),
    step(4,"Message to the community","Optional",
      h("label",{for:"f-msg"},"Message",msgTa),
      h("div",{class:"glabel"},"Show the red dot for"),dayPills("f-days",m?m.days:3)),
    err,
    families.has(id)&&!editingOther?h("button",{class:"linkdanger",type:"button",onclick:()=>confirmRemove(id)},icon("trash",16),"Delete my flag"):null,
    h("div",{class:"formbar"},h("button",{class:"primary",type:"submit"},icon("check",18),"Save"),h("button",{type:"button",onclick:()=>families.has(id)?openFamily(id):closeSheet()},"Cancel")));

  };

// The little scene at the top of the welcome: rivers, families' flags popping up, two of them connecting.

  const d=h("div",{class:"wl-hero","aria-hidden":"true"});
  d.innerHTML=`<svg class="wl-svg" viewBox="0 0 320 150"><path class="wl-river" stroke-width="9" d="M-10 132 C70 122 120 100 165 86 S265 48 330 32"/><path class="wl-river b" stroke-width="6" d="M-10 152 C55 148 120 114 165 86"/>`+
    `<path class="wl-link" pathLength="1" d="M100 64 Q155 8 208 38"/>`+
    flag(86,104,0,"you")+flag(206,80,1)+flag(150,136,2)+flag(268,120,3)+flag(42,142,4)+
    `<g class="wl-bub"><rect x="222" y="6" width="46" height="26" rx="13"/><circle cx="235" cy="19" r="2.6"/><circle cx="245" cy="19" r="2.6"/><circle cx="255" cy="19" r="2.6"/></g></svg>`;

}

      h("div",{class:"actions"},

        h("div",{class:"stat"+(unread.length?" hot":"")},h("b",null,String(unread.length)),h("span",null,unread.length===1?"new message":"new messages"))));
    if(pend)card.append(h("p",{class:"note",style:"margin:0 0 10px"},h("b",null,`${pend} connection request${pend>1?"s":""}`)," waiting for your reply."));
    if(unread.length){const ul=h("ul",{class:"news"});for(const f of unread.slice(0,3))ul.append(h("li",null,h("b",null,f.name||"Family"),": ",f.message.text.length>70?f.message.text.slice(0,70)+"…":f.message.text));card.append(ul)}
