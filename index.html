<title>Koblenz Telugu Families</title>
<meta name="description" content="Private community map for Telugu families in Koblenz and nearby towns.">

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --bg:#eef1ec; --ink:#1c2a2f; --muted:#5b6a6e; --surface:#ffffff; --line:#d9e0dc;
  --accent:#d9860b; --accent-ink:#ffffff; --dot:#c62f2a; --halo:#ffffff; --focus:#1f6f8b;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --telugu:"Mandali","Noto Sans Telugu",ui-sans-serif,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11181b; --ink:#e7eeec; --muted:#9aaaae; --surface:#1f292d; --line:#33424a;
  --accent:#f0a032; --accent-ink:#1a1206; --dot:#ff5a4f; --halo:#11181b; --focus:#7cc4dd; color-scheme:dark}
  .maplibregl-canvas{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.7)}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;position:fixed;inset:0;padding:env(safe-area-inset-top,0) 0 0;touch-action:manipulation}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px 10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;z-index:1000}
.brand{display:flex;flex-direction:column;min-width:0;flex:1;color:inherit;text-decoration:none;border-radius:8px;-webkit-tap-highlight-color:transparent}
.brand:active h1{opacity:.6}
@media (hover:hover){.brand:hover h1{color:var(--accent)}}
.brand h1{font-family:var(--display);font-size:19px;margin:0;line-height:1.1;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12.5px}
.brand small .te{font-family:var(--telugu);font-size:14px;color:var(--ink)}
.search{flex-basis:100%;order:5;display:flex}
@media (min-width:820px){.search{flex-basis:260px;order:0}}
.search input{border-radius:999px;padding:7px 14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.ghost{background:transparent}
.link{background:none;border:0;padding:0;color:var(--focus);text-decoration:underline}
.danger{color:var(--dot);border-color:var(--dot);background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border-radius:999px}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.stage{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--bg)}
.maplibregl-map{font-family:var(--body)}
.maplibregl-ctrl-group button{padding:0;border-radius:0}
.placing #map .maplibregl-canvas-container{cursor:crosshair}
.overlay{position:absolute;inset:0;z-index:1500;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(380px,100%);max-height:100%;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.15)}
.card h2{font-family:var(--display);font-size:20px;margin:0 0 4px}
.card p{margin:0 0 12px;color:var(--muted);font-size:14px}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.12);padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:1200}
@media (min-width:820px){#sheet{left:auto;top:0;width:380px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line)}}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sheet-head h2{font-family:var(--display);font-size:20px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-head .sub{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.x{width:36px;height:36px;padding:0;font-size:18px;flex:none}
.msg{border:1px solid var(--dot);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:color-mix(in srgb,var(--dot) 7%,var(--surface))}
.msg .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dot);font-weight:700}
.msg p{margin:4px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .when{font-size:12.5px;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dt{color:var(--muted);font-size:13px}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline .small{padding:3px 8px;font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.note b{color:var(--ink)}
form{display:flex;flex-direction:column;gap:12px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-family:var(--display);font-size:15px;font-weight:700;padding:0;margin-bottom:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.opt{font-size:11.5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs{display:flex;flex-wrap:wrap;gap:8px 14px}
.langs label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.langs input{width:auto}
.err{color:var(--dot);font-size:13px;min-height:1em}
.ok{color:var(--ink);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.list button{text-align:left;display:flex;flex-direction:column;gap:2px}
.list b{font-family:var(--display)}
.list span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.placebar{position:absolute;left:16px;right:16px;top:12px;margin:0 auto;max-width:460px;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:1300}
.placebar p{margin:0;font-size:14px}
.placebar .actions{margin:0}
.sugg{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow:auto}
.sugg button{text-align:left;padding:6px 10px;font-size:14px}
.placed{font-size:13.5px;color:var(--muted)}
.placed.yes{color:var(--ink)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13.5px;z-index:2000;max-width:calc(100% - 32px);text-align:center}
.empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:900;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;width:min(320px,calc(100% - 32px));text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.empty h2{font-family:var(--display);font-size:17px;margin:0 0 6px}
.empty p{margin:0 0 12px;color:var(--muted);font-size:14px}
/* flag markers */
.flag{position:relative;width:0;height:0;transform:scale(var(--s,1));transform-origin:0 0;transition:transform .25s ease}
.flag.crowded .nm{display:none}
.flag-icon:hover .flag.crowded .nm,.flag-icon:focus .flag.crowded .nm{display:block}
.flag .pole{position:absolute;left:-1px;bottom:-2px;width:2px;height:30px;background:var(--ink);border-radius:1px}
.flag .pen{position:absolute;left:1px;bottom:12px;width:18px;height:12px;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%)}
.flag .base{position:absolute;left:-3.5px;bottom:-5px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.flag .nm{position:absolute;left:22px;bottom:9px;white-space:nowrap;font-weight:700;font-size:13px;color:var(--ink);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 2px var(--halo)}
.flag .dot{position:absolute;left:12px;bottom:23px;width:11px;height:11px;border-radius:50%;background:var(--dot);border:1.5px solid var(--halo)}
.flag .dot.read{background:var(--halo);border:2px solid var(--dot);width:10px;height:10px}
.flag .dot.unread::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--dot);animation:pulse 1.8s ease-out infinite}
.flag.mine .pen{outline:1.5px solid var(--ink)}
.flag.temp .pen{background:var(--accent);filter:drop-shadow(0 0 4px var(--accent))}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.flag .dot.unread::after{animation:none;opacity:0}}
.flag-icon{width:0;height:0;cursor:pointer;background:none;border:0}
.flag.approx .pen{opacity:.75}
.conn{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;background:var(--bg)}
.conn h3{font-family:var(--display);font-size:15px;margin:0 0 6px}
.conn p{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.conn .quote{color:var(--ink);font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#2e9b5f}
.choice{display:flex;flex-direction:column;gap:6px}
.choice label{flex-direction:row;align-items:flex-start;gap:8px;color:var(--ink);font-size:14px}
.choice input{width:auto;margin-top:3px}
.choice .hint{display:block;color:var(--muted);font-size:12.5px}
.section-title{font-family:var(--display);font-size:15px;margin:16px 0 8px}
.item{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.item .who{min-width:0;overflow-wrap:anywhere}
.item .who b{font-family:var(--display)}
.item .who span{display:block;font-size:12.5px;color:var(--muted)}
.req{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.req b{font-family:var(--display)}
.dirs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.dirs .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.btnlink{display:inline-flex;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;background:var(--surface)}
.btnlink:hover{border-color:var(--accent)}
/* opening animation */
.intro{position:fixed;inset:0;z-index:5000;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;cursor:pointer;transition:opacity .5s ease,visibility .5s}
.intro.out{opacity:0;visibility:hidden}
.intro svg{width:min(300px,78vw);height:auto;overflow:visible}
.intro .river{fill:none;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .9s cubic-bezier(.5,0,.2,1) forwards}
.intro .rhine{stroke:#7fb3cc;stroke-width:9}
.intro .mosel{stroke:#9cc8da;stroke-width:6;animation-delay:.15s}
.intro .pole{fill:var(--ink);transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise .35s .65s cubic-bezier(.3,1.4,.5,1) forwards}
.intro .pen{fill:var(--accent);transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:unfurl .3s .95s ease-out forwards,wave 1.6s 1.25s ease-in-out infinite}
.intro .glow{fill:var(--accent);opacity:0;transform-box:fill-box;transform-origin:center;animation:glow 1s .9s ease-out forwards}
.intro h1{font-family:var(--display);font-size:clamp(24px,6vw,34px);margin:14px 0 0;letter-spacing:-.01em;opacity:0;animation:up .5s .8s ease-out forwards}
.intro .te{font-family:var(--telugu);font-size:clamp(18px,4.5vw,22px);color:var(--muted);opacity:0;animation:up .5s .95s ease-out forwards}
.intro .skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--muted);opacity:0;animation:up .4s 1.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{to{transform:scaleY(1)}}
@keyframes unfurl{to{transform:scaleX(1)}}
@keyframes wave{0%,100%{transform:scaleX(1) skewY(0)}50%{transform:scaleX(.9) skewY(-6deg)}}
@keyframes glow{0%{opacity:.5;transform:scale(.2)}100%{opacity:0;transform:scale(2.6)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
/* welcome card */
.welcome .card{animation:pop .45s cubic-bezier(.2,.9,.3,1.1) both}
.welcome .hello{font-family:var(--telugu);font-size:20px;color:var(--accent);margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.hot b{color:var(--dot)}
.steps{margin:4px 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.news{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.news li{font-size:14px;overflow-wrap:anywhere}
.news li b::before{content:"● ";color:var(--dot)}
@media (prefers-reduced-motion:reduce){.intro *,.welcome .card{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>

<div id="intro" class="intro" role="presentation">

<script>
(function(){
  var el=document.getElementById("intro"),done=false,resolve;
  window.__introDone=new Promise(function(r){resolve=r});
  function finish(){if(done)return;done=true;el.classList.add("out");resolve();setTimeout(function(){el.hidden=true},550)}
  var reduce=false;try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  var seen=false;try{seen=sessionStorage.getItem("introSeen")==="1";sessionStorage.setItem("introSeen","1")}catch(e){}
  if(seen){el.hidden=true;done=true;resolve();return}
  setTimeout(finish,reduce?300:1900);
  el.addEventListener("click",finish);
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ---------- constants ----------
const KOBLENZ=[50.356,7.594];
const MAP_STYLE="https://tiles.openfreemap.org/styles/liberty";
const introDone=window.__introDone||Promise.resolve();
const LANGS=["Telugu","German","English","Hindi","Tamil","Kannada"];
const DAYS=[1,3,5,7,14];
const $=id=>document.getElementById(id);
const sheet=$("sheet");

// ---------- helpers ----------
function h(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e[k]=v;else e.setAttribute(k,v===true?"":v)}for(const c of kids){if(c==null)continue;e.append(c.nodeType?c:String(c))}return e}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>Date.now();
const activeMsg=f=>f&&f.message&&f.message.text&&f.message.expiresAt>now()?f.message:null;
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function fmtLeft(ms){const hrs=Math.round(ms/3600000);if(hrs<24)return `${Math.max(1,hrs)} hour${hrs===1?"":"s"} left`;const d=Math.round(hrs/24);return `${d} day${d>1?"s":""} left`}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"})}catch(e){return""}}
function norm(s){return String(s||"").toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function copyRow(text){const span=h("span",{style:"user-select:all"},text);const btn=h("button",{type:"button",class:"small",onclick:async()=>{try{await navigator.clipboard.writeText(text);btn.textContent="Copied"}catch(e){btn.textContent="Copy failed"}}},"Copy");return h("div",{class:"inline"},span,btn)}
function head(title,sub){return h("div",{class:"sheet-head"},h("h2",null,title,sub?h("span",{class:"sub"},sub):null),h("button",{class:"x ghost",type:"button","aria-label":"Close",onclick:closeSheet},"✕"))}

// "Löhrstraße 12, 56068 Koblenz" -> "Löhrstraße, 56068 Koblenz"
function partialAddress(a){return String(a||"").replace(/(\D)\s+\d+\s*[a-zA-Z]?(\s*[-–\/]\s*\d+\s*[a-zA-Z]?)?(?=\s*(,|$))/,"$1").replace(/\s+,/g,",").trim()}
// shift of 50 m in a random direction, so an "on request" flag doesn't point at the house
const FUZZ_M=50;
function makeFuzz(lat,angle){const a=angle==null?Math.random()*2*Math.PI:angle;return[+(FUZZ_M*Math.cos(a)/111320).toFixed(6),+(FUZZ_M*Math.sin(a)/(111320*Math.cos(lat*Math.PI/180))).toFixed(6)]}
const r6=x=>+(+x).toFixed(6);

// ---------- state ----------
let me=null, isAdmin=false, families=new Map(), privates=new Map(), seen={}, openId=null, placing=null;
let outReq=new Map(), inReq=new Map();   // keyed by the other person's id
const markers=new Map(), privSubs=new Map(); let unsubs=[]; let migrated=false;

function connStatus(id){
  const o=outReq.get(id),i=inReq.get(id);
  if((o&&o.status==="accepted")||(i&&i.status==="accepted"))return"connected";
  if(i&&i.status==="pending")return"incoming";
  if(o)return"sent";
  return"none";
}
function connectedIds(){const s=new Set();for(const [k,v] of outReq)if(v.status==="accepted")s.add(k);for(const [k,v] of inReq)if(v.status==="accepted")s.add(k);return s}
function syncPrivateSubs(){
  const want=connectedIds();if(me)want.add(me);
  for(const [id,u] of privSubs)if(!want.has(id)){u();privSubs.delete(id);privates.delete(id)}
  for(const id of want)if(!privSubs.has(id))privSubs.set(id,onSnapshot(doc(db,"private",id),s=>{if(s.exists())privates.set(id,s.data());else privates.delete(id);refresh();if(openId===id)openFamily(id,true)},()=>{}));
}
function famPos(f){const p=privates.get(f.id);if(p&&typeof p.lat==="number")return[p.lat,p.lng];return typeof f.lat==="number"?[f.lat,f.lng]:null}
function exactPos(f){const p=privates.get(f.id);if(p&&typeof p.lat==="number")return[p.lat,p.lng];return f.approx?null:famPos(f)}
function visibleAddress(f){const p=privates.get(f.id);if(p&&p.address)return{text:p.address,full:true};if(!f.approx&&f.address)return{text:f.address,full:true};if(f.street)return{text:f.street,full:false};return null}
function visibleContact(f){const p=privates.get(f.id);if(p&&p.contact)return p.contact;return f.contact||""}
function hasHidden(f){if(privates.get(f.id))return false;return !!f.approx||f.contactPublic===false}

// ---------- auth UI ----------
function showAuth(mode="login",msg=""){
  const a=$("auth");a.hidden=false;a.textContent="";
  const email=h("input",{type:"email",id:"a-email",autocomplete:"email",required:true});
  const pw=h("input",{type:"password",id:"a-pw",autocomplete:mode==="signup"?"new-password":"current-password",minlength:6,required:true});
  const err=h("div",{class:msg?"ok":"err",role:"alert"},msg);
  const form=h("form",{novalidate:true},
    h("label",{for:"a-email"},"Email",email),
    mode!=="reset"?h("label",{for:"a-pw"},mode==="signup"?"Choose a password (at least 6 characters)":"Password",pw):null,
    err,
    h("button",{class:"primary",type:"submit"},mode==="signup"?"Create account":mode==="reset"?"Send reset email":"Log in"));
  form.onsubmit=async e=>{
    e.preventDefault();err.className="err";err.textContent="";
    const em=email.value.trim();if(!em){err.textContent="Enter your email.";return}
    const btn=form.querySelector("button[type=submit]");btn.disabled=true;
    try{
      if(mode==="reset"){await sendPasswordResetEmail(auth,em);showAuth("login","Check your inbox for a link to reset your password.");return}
      if(mode==="signup")await createUserWithEmailAndPassword(auth,em,pw.value);
      else await signInWithEmailAndPassword(auth,em,pw.value);
    }catch(x){btn.disabled=false;err.textContent=authError(x&&x.code)}

    ?h("p",{style:"margin:12px 0 0"},"New here? ",h("button",{class:"link",type:"button",onclick:()=>showAuth("signup")},"Create an account")," · ",h("button",{class:"link",type:"button",onclick:()=>showAuth("reset")},"Forgot password?"))
    :h("p",{style:"margin:12px 0 0"},h("button",{class:"link",type:"button",onclick:()=>showAuth("login")},"Back to log in"));
  a.append(h("div",{class:"card"},
    h("h2",null,mode==="signup"?"Join the community map":mode==="reset"?"Reset your password":"Welcome"),
    h("p",null,"See Telugu families living near you in Koblenz and around, and connect with them."),
    form,switcher,
    h("div",{class:"note"},h("b",null,"Why do I need to log in? "),"The map shows where families live, so it's only visible to members who log in. Logging in also makes sure only you can change your own family's flag.")));
  setTimeout(()=>email.focus(),50);
}
function authError(code){return({
  "auth/invalid-credential":"Wrong email or password.","auth/wrong-password":"Wrong email or password.","auth/user-not-found":"No account with this email. Create one instead.",
  "auth/email-already-in-use":"This email already has an account. Log in instead.","auth/weak-password":"Use at least 6 characters for the password.",
  "auth/invalid-email":"That email address doesn't look right.","auth/too-many-requests":"Too many tries. Wait a few minutes and try again.",
  "auth/network-request-failed":"No internet connection. Try again."}[code]||"Something went wrong. Please try again.")}

onAuthStateChanged(auth,async user=>{
  unsubs.forEach(u=>u());unsubs=[];for(const u of privSubs.values())u();privSubs.clear();privates.clear();
  families.clear();outReq.clear();inReq.clear();redrawFlags();closeSheet();
  $("welcome").hidden=true;
  if(!user){me=null;isAdmin=false;for(const b of ["mineBtn","msgsBtn","reqBtn","searchWrap","empty"])$(b).hidden=true;await introDone;if(!auth.currentUser)showAuth();return}
  me=user.uid;$("auth").hidden=true;$("searchWrap").hidden=false;
  try{isAdmin=(await getDoc(doc(db,"admins",me))).exists()}catch(e){isAdmin=false}
  let gotFam,gotSeen,gotIn;const famReady=new Promise(r=>gotFam=r),seenReady=new Promise(r=>gotSeen=r),inReady=new Promise(r=>gotIn=r);
  unsubs.push(onSnapshot(collection(db,"families"),snap=>{
    const m=new Map();snap.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));families=m;refresh();gotFam();
    if(openId&&!families.has(openId))closeSheet();
    if(isAdmin&&!migrated){migrated=true;migrateOldFlags()}
  },()=>{gotFam();toast("Couldn't load the families. Reload to try again.")}));
  unsubs.push(onSnapshot(doc(db,"seen",me),s=>{seen=s.exists()&&s.data().seen?{...s.data().seen}:{};refresh();gotSeen()},()=>gotSeen()));
  unsubs.push(onSnapshot(query(collection(db,"requests"),where("to","==",me)),snap=>{
    const m=new Map();snap.forEach(d=>{const r=d.data();m.set(r.from,{id:d.id,...r})});inReq=m;syncPrivateSubs();refresh();gotIn();
    if(openId)openFamily(openId,true);if(sheet.dataset.mode==="conn")showConnections();
  },()=>gotIn()));
  unsubs.push(onSnapshot(query(collection(db,"requests"),where("from","==",me)),snap=>{
    const m=new Map();snap.forEach(d=>{const r=d.data();m.set(r.to,{id:d.id,...r})});outReq=m;syncPrivateSubs();refresh();
    if(openId)openFamily(openId,true);if(sheet.dataset.mode==="conn")showConnections();
  },()=>{}));
  syncPrivateSubs();
  const uid=me;
  await Promise.all([introDone,famReady,Promise.race([Promise.all([seenReady,inReady]),new Promise(r=>setTimeout(r,2500))])]);
  if(me===uid)maybeWelcome(user);
});

// Flags saved before privacy settings existed: move contact into private storage (admin only, runs once).
async function migrateOldFlags(){
  const old=[...families.values()].filter(f=>f.v!==2&&typeof f.lat==="number");
  for(const f of old){
    try{
      const b=writeBatch(db);
      b.set(doc(db,"private",f.id),{lat:r6(f.lat),lng:r6(f.lng),address:f.address||"",contact:f.contact||"",dLat:0,dLng:0});
      b.set(doc(db,"families",f.id),{name:f.name,lat:r6(f.lat),lng:r6(f.lng),approx:false,locPublic:true,contactPublic:false,
        street:partialAddress(f.address||""),address:f.address||"",contact:"",
        profession:f.profession||"",interests:f.interests||"",members:f.members??null,kids:f.kids??null,
        languages:f.languages||[],about:f.about||"",message:f.message||null,updatedAt:f.updatedAt||now(),v:2});
      await b.commit();
    }catch(e){console.warn("migration",f.id,e)}
  }
}

// ---------- flags ----------
function flagHTML(f,{temp=false}={}){
  const m=activeMsg(f);let dot="";
  if(m&&!temp)dot=`<span class="dot ${seen[f.id]===m.postedAt?"read":"unread"}"></span>`;
  const approx=!temp&&!exactPos(f)?" approx":"";
  return `<div class="flag${f.id===me?" mine":""}${temp?" temp":""}${approx}"><span class="pole"></span><span class="pen"></span><span class="base"></span>${dot}<span class="nm">${esc(f.name||"Your flag")}</span></div>`;
}
function makeFlagEl(id){
  const el=document.createElement("div");el.className="flag-icon";el.tabIndex=0;el.setAttribute("role","button");
  el.addEventListener("click",e=>{e.stopPropagation();if(!placing)openFamily(id)});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();if(!placing)openFamily(id)}});
  return el;
}
function redrawFlags(){
  for(const [id,o] of markers)if(!families.has(id)||(placing&&placing.id===id)){o.mk.remove();markers.delete(id)}
  const list=[...families.values()].map(f=>({f,p:famPos(f)})).filter(o=>o.p&&!(placing&&placing.id===o.f.id)).sort((a,b)=>b.p[0]-a.p[0]);
  for(const {f,p} of list){
    let o=markers.get(f.id);
    if(!o){const el=makeFlagEl(f.id);o={el,mk:new maplibregl.Marker({element:el,anchor:"top-left"}).setLngLat([p[1],p[0]]).addTo(map)};markers.set(f.id,o)}
    else o.mk.setLngLat([p[1],p[0]]);
    o.el.setAttribute("aria-label",(f.name||"Family")+" flag");
    const html=flagHTML(f);if(o.el._h!==html){o.el.innerHTML=html;o.el._h=html}
  }
  scaleFlags();
}
// Flags grow when they're spread out and shrink when they're crowded together.
function scaleFlags(){
  const pts=[];for(const [id,o] of markers){const ll=o.mk.getLngLat();pts.push([o,map.project(ll)])}
  for(const [o,p] of pts){
    let d=Infinity;for(const [o2,q] of pts){if(o2===o)continue;const dd=Math.hypot(p.x-q.x,p.y-q.y);if(dd<d)d=dd}
    const s=d===Infinity?1.3:Math.max(.7,Math.min(1.3,.7+(d-30)/150));
    const el=o.el.querySelector(".flag");if(!el)continue;
    el.style.setProperty("--s",s.toFixed(2));el.classList.toggle("crowded",d<70);
  }
}
map.on("zoomend",scaleFlags);map.on("moveend",scaleFlags);

function refresh(){
  redrawFlags();
  const act=[...families.values()].filter(f=>activeMsg(f)),unread=act.filter(f=>seen[f.id]!==f.message.postedAt).length;
  $("msgsBtn").hidden=!me||act.length===0;
  $("msgsCount").textContent=unread?`${unread} new message${unread>1?"s":""}`:`${act.length} message${act.length>1?"s":""}`;
  $("msgsBtn").querySelector(".d").style.visibility=unread?"visible":"hidden";
  const pend=[...inReq.values()].filter(r=>r.status==="pending").length;
  $("reqBtn").hidden=!me||pend===0;
  $("reqCount").textContent=`${pend} request${pend>1?"s":""}`;
  const mb=$("mineBtn");mb.hidden=!me;mb.textContent=families.has(me)?"My family":"Add my family";
  const e=$("empty");
  if(me&&families.size===0){e.hidden=false;e.textContent="";e.append(h("h2",null,"No families on the map yet"),h("p",null,"Be the first: add your family and put your flag on your home."),h("button",{class:"primary",type:"button",onclick:()=>openForm(me)},"Add my family"))}
  else e.hidden=true;
}
setInterval(()=>{if(families.size)refresh()},60000);
function focusFamily(f){const p=famPos(f);if(p)goTo(p[0],p[1],Math.max(map.getZoom(),16))}

async function markSeen(f){
  const m=activeMsg(f);if(!m||!me||seen[f.id]===m.postedAt)return;
  seen={...seen,[f.id]:m.postedAt};refresh();
  const keep={};for(const id in seen){const g=families.get(id);if(g&&activeMsg(g))keep[id]=seen[id]}
  try{await setDoc(doc(db,"seen",me),{seen:keep})}catch(e){}
}

// ---------- connections ----------
async function sendRequest(to,note){
  const mine=families.get(me);
  await setDoc(doc(db,"requests",me+"_"+to),{from:me,to,note:note.slice(0,200),fromName:(mine&&mine.name||"A family").slice(0,40),status:"pending",createdAt:now()});
}
async function answerRequest(from,accept){
  const r=inReq.get(from);if(!r)return;
  await updateDoc(doc(db,"requests",r.id),{status:accept?"accepted":"declined",respondedAt:now()});
}
async function removeConnection(id){
  const o=outReq.get(id),i=inReq.get(id);
  if(o)await deleteDoc(doc(db,"requests",o.id));
  if(i&&i.status==="accepted")await deleteDoc(doc(db,"requests",i.id));
}
function connectBox(f){
  const id=f.id,st=connStatus(id),box=h("div",{class:"conn"});

    return box;
  }
  if(st==="incoming"){
    const r=inReq.get(id);
    box.append(h("h3",null,`${name} wants to connect`));
    if(r.note)box.append(h("p",{class:"quote"},`"${r.note}"`));
    const err=h("div",{class:"err",role:"alert"});
    box.append(h("div",{class:"actions",style:"margin-top:4px"},
      h("button",{class:"primary",type:"button",onclick:async e=>{e.target.disabled=true;try{await answerRequest(id,true);toast("Connected")}catch(x){e.target.disabled=false;err.textContent="Couldn't accept. Try again."}}},"Accept"),
      h("button",{type:"button",onclick:async e=>{e.target.disabled=true;try{await answerRequest(id,false);toast("Request declined")}catch(x){e.target.disabled=false;err.textContent="Couldn't decline. Try again."}}},"Decline")),err);
    return box;
  }
  if(st==="sent"){
    box.append(h("h3",null,"Request sent"),h("p",{style:"margin:0"},`Waiting for ${name} to reply. Once they accept, you'll see their full address and contact here.`));

    h("p",null,hasHidden(f)?`${name} shares their full address and contact only with connected families.`:`Let ${name} know you'd like to get in touch.`));
  if(!families.has(me)){
    box.append(h("button",{class:"primary",type:"button",onclick:()=>openForm(me)},"Add your family first"));
    box.append(h("p",{style:"margin:8px 0 0"},"So they know who is asking."));
    return box;
  }
  const ta=h("textarea",{id:"c-note",maxlength:200,rows:2,placeholder:"Optional note, e.g. We just moved to Lützel and have a 4-year-old too!"});
  const err=h("div",{class:"err",role:"alert"});
  box.append(h("label",{for:"c-note"},h("span",null,"Add a short note ",h("span",{class:"opt"},"(optional)")),ta),err,
    h("div",{class:"actions",style:"margin-top:8px"},h("button",{class:"primary",type:"button",onclick:async e=>{e.target.disabled=true;err.textContent="";try{await sendRequest(id,ta.value.trim());toast("Request sent")}catch(x){e.target.disabled=false;err.textContent="Couldn't send the request. Try again."}}},"Send connection request")));
  return box;
}

        h("button",{type:"button",onclick:async e=>{e.target.disabled=true;try{await answerRequest(r.from,false)}catch(x){e.target.disabled=false;err.textContent="Couldn't decline. Try again."}}},"Decline"),
        families.has(r.from)?h("button",{class:"ghost",type:"button",onclick:()=>{const f=families.get(r.from);focusFamily(f);openFamily(r.from)}},"See on map"):null),err));

      sheet.append(h("div",{class:"item"},h("div",{class:"who"},h("b",null,nameOf(r.to)),h("span",null,"Waiting for reply")),r.status==="pending"?c:null));

// ---------- details ----------
function openFamily(id,keepScroll){
  const f=families.get(id);if(!f)return;
  const sc=sheet.scrollTop;openId=id;sheet.hidden=false;sheet.textContent="";sheet.dataset.mode="";
  sheet.append(head(f.name||"Family"));
  const m=activeMsg(f);
  if(m)sheet.append(h("div",{class:"msg"},h("div",{class:"lbl"},"Message to the community"),h("p",null,m.text),h("div",{class:"when"},`Posted ${fmtDate(m.postedAt)} · ${fmtLeft(m.expiresAt-now())}`)));
  const dl=h("dl"),add=(k,v)=>{if(v==null||v==="")return;dl.append(h("dt",null,k),h("dd",null,v))};
  const addr=visibleAddress(f);
  if(addr)add(addr.full?"Address":"Area",addr.full?copyRow(addr.text):h("span",null,addr.text,h("span",{class:"opt",style:"color:var(--muted)"}," · flag shown nearby, not exact")));
  add("What we do",f.profession);add("Interests",f.interests);
  if(f.members||f.kids)add("Family",[f.members?`${f.members} member${f.members>1?"s":""}`:null,f.kids?`${f.kids} kid${f.kids>1?"s":""}`:null].filter(Boolean).join(" · "));
  if(f.languages&&f.languages.length)add("Languages",f.languages.join(", "));
  add("About us",f.about);
  const contact=visibleContact(f);if(contact)add("Contact",copyRow(contact));
  sheet.append(dl.children.length?dl:h("p",{class:"note"},"This family hasn't shared more details yet."));
  const ex=exactPos(f);
  if(ex){
    const dest=`${ex[0]},${ex[1]}`;
    const g=h("a",{class:"btnlink",href:`https://www.google.com/maps/dir/?api=1&destination=${dest}`,target:"_blank",rel:"noopener"},"Google Maps ↗");
    const a=h("a",{class:"btnlink",href:`https://maps.apple.com/?daddr=${dest}`,target:"_blank",rel:"noopener"},"Apple Maps ↗");
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&"ontouchend" in document);
    sheet.append(h("div",{class:"dirs"},h("span",{class:"lbl"},"Directions"),...(ios?[a,g]:[g,a])));
  }
  if(id===me){
    sheet.append(h("p",{class:"note"},h("b",null,"Who sees what: "),
      `Exact location and address: ${f.approx?"only connected families (others see your flag nearby)":"everyone"}. Contact: ${f.contactPublic?"everyone":"only connected families"}.`));
    sheet.append(h("div",{class:"actions"},h("button",{class:"primary",type:"button",onclick:()=>openForm(me)},"Edit my family"),h("button",{type:"button",onclick:showConnections},"My connections")));
  }else{
    sheet.append(connectBox(f));
    if(isAdmin)sheet.append(h("div",{class:"actions"},h("button",{type:"button",onclick:()=>openForm(id)},"Edit (admin)"),h("button",{class:"danger",type:"button",onclick:()=>confirmRemove(id)},"Remove pin")));
  }
  if(keepScroll)sheet.scrollTop=sc;
  markSeen(f);
}
function confirmRemove(id){

      h("button",{type:"button",onclick:()=>id===me?openForm(id):openFamily(id)},"Cancel")));

$("msgsBtn").onclick=()=>{

$("mineBtn").onclick=()=>{const f=families.get(me);if(f){focusFamily(f);openFamily(me)}else openForm(me)};
$("infoBtn").onclick=()=>{
  openSheet();openId=null;sheet.dataset.mode="";sheet.append(head("About this map"),
    h("p",null,"A members-only map for Telugu families in Koblenz and nearby towns, so you can see who lives close by and say hello."),
    h("div",{class:"note"},h("b",null,"Why log in? "),"The map shows where families live, so only logged-in members can see it. Logging in also makes sure only you can change your family's flag. The admin can edit or remove any flag to keep the map tidy."),
    h("div",{class:"note"},h("b",null,"Your privacy. "),"You decide who sees your exact location, address and contact: everyone, or only families you've connected with. Others then see only your street and a flag placed nearby."),

    h("details",null,h("summary",{style:"font-size:13px;color:var(--muted)"},"Your user ID (for admin setup)"),copyRow(me)),
    h("div",{class:"actions"},h("button",{type:"button",onclick:()=>signOut(auth)},"Log out")));

// ---------- family search ----------
let qTimer=0;
$("q").addEventListener("input",()=>{clearTimeout(qTimer);qTimer=setTimeout(runSearch,150)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runSearch()}});
function runSearch(){
  const raw=$("q").value.trim(),q=norm(raw);if(!q){if(sheet.dataset.mode==="search"){closeSheet();sheet.dataset.mode=""}return}
  const terms=q.split(" ");
  const hits=[...families.values()].filter(f=>{const a=visibleAddress(f);const hay=norm([f.name,f.profession,f.interests,f.about,(f.languages||[]).join(" "),a&&a.text].filter(Boolean).join(" "));return terms.every(t=>hay.includes(t))});
  openSheet();openId=null;sheet.dataset.mode="search";
  sheet.append(head(hits.length?`${hits.length} famil${hits.length>1?"ies":"y"} found`:"No families found",`for "${raw}"`));
  const list=h("div",{class:"list"});
  for(const f of hits)list.append(h("button",{type:"button",onclick:()=>{sheet.dataset.mode="";focusFamily(f);openFamily(f.id)}},h("b",null,f.name||"Family"),h("span",null,[f.profession,f.interests].filter(Boolean).join(" · ")||"No details yet")));
  if(!hits.length)list.append(h("p",{class:"note"},"Try a shorter word, like a first name, a job or an interest."));
  sheet.append(list);
}

// ---------- placing the flag ----------
let tempMarker=null,tempEl=null;
function setTemp(lat,lng,label){
  placing.pos=[lat,lng];if(label!==undefined)placing.addr=label;
  if(!tempMarker){
    tempEl=document.createElement("div");tempEl.className="flag-icon";tempEl.innerHTML=flagHTML({name:placing.name},{temp:true});
    tempMarker=new maplibregl.Marker({element:tempEl,anchor:"top-left",draggable:true}).setLngLat([lng,lat]).addTo(map);
    tempMarker.on("dragend",()=>{const p=tempMarker.getLngLat();placing.pos=[p.lat,p.lng];placing.addr=null});
  }else tempMarker.setLngLat([lng,lat]);
  $("p-done").disabled=false;
}
map.on("click",e=>{if(placing)setTemp(e.lngLat.lat,e.lngLat.lng,null)});
function startPlacing(id,name,pos,onDone){
  placing={id,name:name||"Your flag",pos:null,addr:null,onDone};
  sheet.hidden=true;$("placebar").hidden=false;$("stage").classList.add("placing");
  $("p-addr").value="";$("p-sugg").textContent="";$("p-done").disabled=true;
  showHouseNumbers(true);redrawFlags();
  if(pos){setTemp(pos[0],pos[1]);goTo(pos[0],pos[1],Math.max(map.getZoom(),17))}
}
function endPlacing(ok){
  const p=placing;placing=null;if(tempMarker){tempMarker.remove();tempMarker=null;tempEl=null}
  $("placebar").hidden=true;$("stage").classList.remove("placing");sheet.hidden=false;showHouseNumbers(false);redrawFlags();
  if(ok&&p&&p.pos)p.onDone(p.pos,p.addr);
}
$("p-done").onclick=()=>endPlacing(true);
$("p-cancel").onclick=()=>endPlacing(false);
$("p-go").onclick=addrSearch;
$("p-addr").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addrSearch()}});
let lastGeo=0;
async function addrSearch(){
  const q=$("p-addr").value.trim(),box=$("p-sugg");box.textContent="";
  if(q.length<3){box.append(h("span",{class:"placed"},"Type your street and house number."));return}
  const wait=Math.max(0,1100-(now()-lastGeo));if(wait)await new Promise(r=>setTimeout(r,wait));lastGeo=now();
  box.append(h("span",{class:"placed"},"Searching…"));
  try{
    const u=new URL("https://nominatim.openstreetmap.org/search");
    u.search=new URLSearchParams({q,format:"jsonv2",countrycodes:"de",viewbox:"7.20,50.55,7.95,50.15",bounded:"0",limit:"6",addressdetails:"1","accept-language":"de"}).toString();
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);const res=await r.json();box.textContent="";
    if(!res.length){box.append(h("span",{class:"placed"},"No match. Check the spelling, or tap your house on the map."));return}
    for(const x of res){const a=x.address||{};
      const label=[[a.road||a.pedestrian||a.footway,a.house_number].filter(Boolean).join(" "),[a.postcode,a.city||a.town||a.village||a.suburb].filter(Boolean).join(" ")].filter(Boolean).join(", ")||x.display_name.split(",").slice(0,3).join(",");
      box.append(h("button",{type:"button",onclick:()=>{setTemp(+x.lat,+x.lon,label);goTo(+x.lat,+x.lon,18);box.textContent="";$("p-addr").value=label}},label))}
  }catch(e){box.textContent="";box.append(h("span",{class:"placed"},"Address search is not available right now. Tap your house on the map instead."))}
}
$("p-loc").onclick=()=>{
  if(!navigator.geolocation){toast("Location isn't available on this device.");return}
  $("p-loc").disabled=true;
  navigator.geolocation.getCurrentPosition(p=>{$("p-loc").disabled=false;setTemp(p.coords.latitude,p.coords.longitude,null);goTo(p.coords.latitude,p.coords.longitude,18);toast("Check the flag sits on your house, then tap Done.")},
    ()=>{$("p-loc").disabled=false;toast("Couldn't get your location. Search your address instead.")},{enableHighAccuracy:true,timeout:12000});
};

// ---------- form ----------
async function openForm(id){
  if(!id)return;const f=families.get(id)||{},editingOther=id!==me;
  let priv=privates.get(id)||null;
  if(!priv&&families.has(id)){try{const s=await getDoc(doc(db,"private",id));if(s.exists())priv=s.data()}catch(e){}}
  openSheet();openId=null;sheet.dataset.mode="";
  sheet.append(head(editingOther?"Edit family (admin)":families.has(id)?"Edit my family":"Add my family",editingOther?null:"Only you and the admin can change this"));
  const v=x=>x==null?"":String(x);
  const inp=(idn,label,val,o={},opt=true)=>{const i=h(o.tag||"input",Object.assign({id:idn},o.tag?{}:{type:o.type||"text"},o.extra||{}));i.value=val;return h("label",{for:idn},h("span",null,label,opt?h("span",{class:"opt"}," (optional)"):null),i)};
  let pos=priv&&typeof priv.lat==="number"?[priv.lat,priv.lng]:(typeof f.lat==="number"&&!f.approx?[f.lat,f.lng]:null);
  const fullAddr=priv?priv.address:(f.address||""), fullContact=priv?priv.contact:(f.contact||"");
  const locPublic=f.v===2?!f.approx:true, contactPublic=f.v===2?!!f.contactPublic:false;
  const err=h("div",{class:"err",role:"alert"});
  const placedTxt=h("span",{class:"placed"}),placeBtn=h("button",{type:"button"});
  const sync=()=>{placedTxt.textContent=pos?"✓ Flag placed":"Not placed yet";placedTxt.className="placed"+(pos?" yes":"");placeBtn.textContent=pos?"Move my flag":"Place my flag on the map";placeBtn.className=pos?"":"primary"};
  placeBtn.onclick=()=>startPlacing(id,$("f-name").value.trim()||f.name,pos,(p,addr)=>{pos=p;sync();err.textContent="";const a=$("f-addr");if(addr&&!a.value.trim()){a.value=addr;updPreview()}});
  sync();
  const radio=(name,val,checked,label,hint)=>h("label",null,h("input",{type:"radio",name,value:val,checked}),h("span",null,label,hint?h("span",{class:"hint"},hint):null));
  const preview=h("span",{class:"hint"});
  const updPreview=()=>{const a=$("f-addr").value.trim();preview.textContent=a?`Others will see: "${partialAddress(a)}" and your flag about 50 m away.`:"Others will see your flag about 50 m away."};
  const langs=h("div",{class:"langs"});
  for(const l of LANGS){const c=h("input",{type:"checkbox",id:"lang-"+l,value:l});c.checked=(f.languages||[]).includes(l);langs.append(h("label",{for:"lang-"+l},c,l))}
  const m=activeMsg(f);
  const daySel=h("select",{id:"f-days"});for(const d of DAYS){const o=h("option",{value:d},`${d} day${d>1?"s":""}`);if((m?m.days:3)===d)o.selected=true;daySel.append(o)}
  const locChoice=h("div",{class:"choice",role:"radiogroup","aria-label":"Who can see your exact location and address"},
    radio("loc","public",locPublic,"Everyone"),
    h("label",null,h("input",{type:"radio",name:"loc",value:"private",checked:!locPublic}),h("span",null,"Only families I've connected with",preview)));
  const contactChoice=h("div",{class:"choice",role:"radiogroup","aria-label":"Who can see your contact"},
    radio("contact","public",contactPublic,"Everyone"),
    radio("contact","private",!contactPublic,"Only families I've connected with"));
  const form=h("form",{novalidate:true},
    h("fieldset",null,h("legend",null,"Your flag"),
      inp("f-name","Family or display name",v(f.name),{extra:{maxlength:40,placeholder:"e.g. Rao family"}},false),
      h("div",{class:"inline"},placeBtn,placedTxt),
      inp("f-addr","Address",v(fullAddr),{extra:{maxlength:120,placeholder:"e.g. Löhrstraße 12, 56068 Koblenz"}})),
    h("fieldset",null,h("legend",null,"Who can see what"),
      h("div",null,h("div",{style:"font-size:13px;color:var(--muted);margin-bottom:6px"},"Exact location and full address"),locChoice),
      inp("f-contact","Contact (phone, WhatsApp or email)",v(fullContact),{extra:{maxlength:80}}),
      h("div",null,h("div",{style:"font-size:13px;color:var(--muted);margin-bottom:6px"},"Contact"),contactChoice)),
    h("fieldset",null,h("legend",null,"About you"),
      inp("f-prof","What you do",v(f.profession),{extra:{maxlength:80,placeholder:"e.g. IT, student, doctor"}}),
      inp("f-int","Interests",v(f.interests),{extra:{maxlength:120,placeholder:"e.g. cricket, cooking, festivals"}}),
      h("div",{class:"row2"},inp("f-mem","Family members",v(f.members),{type:"number",extra:{min:1,max:20,inputmode:"numeric"}}),inp("f-kids","Kids",v(f.kids),{type:"number",extra:{min:0,max:15,inputmode:"numeric"}})),
      h("div",null,h("div",{style:"font-size:13px;color:var(--muted);margin-bottom:6px"},"Languages ",h("span",{class:"opt"},"(optional)")),langs),
      inp("f-about","About us",v(f.about),{tag:"textarea",extra:{maxlength:200,rows:2}})),
    h("fieldset",null,h("legend",null,"Message to the community"),
      inp("f-msg","Message",m?m.text:"",{tag:"textarea",extra:{maxlength:240,rows:2,placeholder:"e.g. Bathukamma get-together on Saturday, all welcome!"}}),
      h("label",{for:"f-days"},h("span",null,"Show the red dot for"),daySel)),
    err,
    h("div",{class:"actions"},h("button",{class:"primary",type:"submit"},"Save"),h("button",{type:"button",onclick:()=>families.has(id)?openFamily(id):closeSheet()},"Cancel"),
      families.has(id)&&!editingOther?h("button",{class:"danger",type:"button",onclick:()=>confirmRemove(id)},"Delete my flag"):null));
  sheet.append(form);
  $("f-addr").addEventListener("input",updPreview);updPreview();
  form.onsubmit=async e=>{
    e.preventDefault();
    const name=$("f-name").value.trim();
    if(!name){err.textContent="Add a family or display name.";$("f-name").focus();return}
    if(!pos){err.textContent="Place your flag on the map first.";placeBtn.focus();return}
    const num=(x,max)=>{const n=parseInt(x,10);return Number.isFinite(n)&&n>=0&&n<=max?n:null};
    const msgText=$("f-msg").value.trim(),days=parseInt(daySel.value,10)||3;
    let message=null;
    if(msgText){if(m&&m.text===msgText&&m.days===days)message={text:m.text,days:m.days,postedAt:m.postedAt,expiresAt:m.expiresAt};else{const t=now();message={text:msgText,days,postedAt:t,expiresAt:t+days*86400000}}}
    const lp=form.querySelector('input[name="loc"]:checked').value==="public";
    const cp=form.querySelector('input[name="contact"]:checked').value==="public";
    const address=$("f-addr").value.trim(),contact=$("f-contact").value.trim();
    const lat=r6(pos[0]),lng=r6(pos[1]);
    let dLat=0,dLng=0;
    if(priv&&priv.lat===lat&&priv.lng===lng&&(priv.dLat||priv.dLng)){[dLat,dLng]=makeFuzz(lat,Math.atan2(priv.dLng*Math.cos(lat*Math.PI/180),priv.dLat))}else{[dLat,dLng]=makeFuzz(lat)}
    const pub={name,lat:lp?lat:r6(lat+dLat),lng:lp?lng:r6(lng+dLng),approx:!lp,locPublic:lp,contactPublic:cp,
      street:partialAddress(address),address:lp?address:"",contact:cp?contact:"",
      profession:$("f-prof").value.trim(),interests:$("f-int").value.trim(),
      members:num($("f-mem").value,20),kids:num($("f-kids").value,15),
      languages:[...langs.querySelectorAll("input:checked")].map(c=>c.value),
      about:$("f-about").value.trim(),message,updatedAt:now(),v:2};
    const prv={lat,lng,address,contact,dLat,dLng};
    const btn=form.querySelector("button[type=submit]");btn.disabled=true;err.textContent="";
    try{
      const b=writeBatch(db);b.set(doc(db,"private",id),prv);b.set(doc(db,"families",id),pub);await b.commit();
      families.set(id,{id,...pub});privates.set(id,prv);refresh();openFamily(id);toast("Saved");
    }catch(x){btn.disabled=false;err.textContent=x&&x.code==="permission-denied"?"You can't save this flag. Check that you're logged in to your own account.":"Couldn't save. Check your connection and try again."}
  };
}

// ---------- welcome ----------
function maybeWelcome(user){
  let shown=false;try{shown=sessionStorage.getItem("welcomed")===me}catch(e){}
  if(shown)return;
  try{sessionStorage.setItem("welcomed",me)}catch(e){}
  const w=$("welcome");w.textContent="";w.hidden=false;
  const close=()=>{w.hidden=true;w.textContent=""};
  w.onclick=e=>{if(e.target===w)close()};
  const mine=families.get(me);
  const others=[...families.values()].filter(f=>f.id!==me);
  const unread=[...families.values()].filter(f=>{const m=activeMsg(f);return m&&f.id!==me&&seen[f.id]!==m.postedAt}).sort((a,b)=>b.message.postedAt-a.message.postedAt);
  const pend=[...inReq.values()].filter(r=>r.status==="pending");
  const famCount=families.size;
  const stats=h("div",{class:"stats"},
    h("div",{class:"stat"},h("b",null,String(famCount)),h("span",null,famCount===1?"family on the map":"families on the map")),
    h("div",{class:"stat"+(unread.length?" hot":"")},h("b",null,String(unread.length)),h("span",null,unread.length===1?"new message":"new messages")));
  const card=h("div",{class:"card",role:"dialog","aria-modal":"true","aria-labelledby":"w-title"});
  if(!mine){
    card.append(
      h("p",{class:"hello"},"నమస్కారం!"),
      h("h2",{id:"w-title"},"Welcome to the community map"),
      h("p",null,others.length?`${others.length} Telugu ${others.length===1?"family is":"families are"} already here. Add yours so neighbours can find you.`:"You're one of the first here. Add your family and invite others from the WhatsApp group."),
      stats,
      h("ol",{class:"steps"},
        h("li",null,"Add your family name and, if you like, what you do and your interests."),
        h("li",null,"Put your flag on your home. You choose who sees your exact address and contact."),
        h("li",null,"Connect with families near you, and post a message to say hello.")),
      h("div",{class:"actions"},
        h("button",{class:"primary",type:"button",onclick:()=>{close();openForm(me)}},"Add my family"),
        h("button",{type:"button",onclick:close},"Explore the map first")),
      h("p",{style:"margin:12px 0 0;font-size:12.5px"},"Signed in as ",h("b",null,user.email||"")));
  }else{
    card.append(
      h("p",{class:"hello"},"నమస్కారం!"),
      h("h2",{id:"w-title"},`Welcome back, ${mine.name||"friend"}`),
      h("p",null,unread.length||pend.length?"Here's what's new since you last looked.":"All caught up. Have a look at who's around you."),
      stats);
    if(pend.length)card.append(h("p",{class:"note",style:"margin:0 0 10px"},h("b",null,`${pend.length} connection request${pend.length>1?"s":""}`)," waiting for your reply."));
    if(unread.length){
      const ul=h("ul",{class:"news"});
      for(const f of unread.slice(0,3))ul.append(h("li",null,h("b",null,f.name||"Family"),": ",f.message.text.length>70?f.message.text.slice(0,70)+"…":f.message.text));
      card.append(ul);
    }
    if(!activeMsg(mine)&&!pend.length)card.append(h("p",{class:"note",style:"margin:0 0 4px"},"Tip: post a message on your flag to invite people to an event or ask a question."));
    const first=pend.length?h("button",{class:"primary",type:"button",onclick:()=>{close();showConnections()}},pend.length===1?"See the request":"See the requests")
      :unread.length?h("button",{class:"primary",type:"button",onclick:()=>{close();$("msgsBtn").click()}},unread.length===1?"Read the message":"Read the messages"):null;
    card.append(h("div",{class:"actions"},first,
      h("button",{class:first?null:"primary",type:"button",onclick:()=>{close();focusFamily(mine)}},"Show my flag"),
      h("button",{type:"button",onclick:close},"Explore the map")));
  }
  w.append(card);
  setTimeout(()=>{const b=card.querySelector("button");if(b)b.focus()},60);
  w.onkeydown=e=>{if(e.key==="Escape")close()};
}
